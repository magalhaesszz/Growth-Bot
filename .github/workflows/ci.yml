name: CI

on:
  push:
    branches:
      - main
      - agent/stability-audit-fixes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: "123:test"
      TELEGRAM_OWNER_ID: "1"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_KEY: "test-key"
      SESSION_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      VIDEO_API_URL: "https://video.example.test"
      VIDEO_API_SECRET: "test-secret"
      VIDEO_SETTINGS_REMOTE: "false"
      VIDEO_MAX_FILE_MB: "45"
      VIDEO_MAX_BATCH_MB: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
